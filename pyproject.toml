[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iceywing"
version = "0.4.1"
description = "Environment + Pop Flow orchestration for local projects and AI-generated code changes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
keywords = ["cli", "git", "automation", "developer-tools", "ai-coding"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = ["psutil>=7.0"]

[project.urls]
Repository = "https://github.com/BAKACIRNONINE/Iceywing"
Changelog = "https://github.com/BAKACIRNONINE/Iceywing/blob/main/CHANGELOG.md"
Releases = "https://github.com/BAKACIRNONINE/Iceywing/releases"

[project.scripts]
iceywing = "iceywing.cli:main"
iw = "iceywing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[project.optional-dependencies]
test = [
    "pytest>=8",
]
dev = [
    "pytest>=8",
]
[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp"
